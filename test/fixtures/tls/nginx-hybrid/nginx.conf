events { worker_connections 1024; }

http {
    server {
        listen 443 ssl;
        server_name app.example;
        ssl_certificate     /etc/nginx/cert/app.pem;
        ssl_certificate_key /etc/nginx/cert/app.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # The hybrid post-quantum group first; TLS 1.3 only can negotiate it.
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
    }
}
